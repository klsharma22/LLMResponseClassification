[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
src = ["packages"]

[dependency-groups]
dev = [
    "kagglehub>=1.0.2",
    "python-dotenv>=1.2.2",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "diff-cover>=10.5.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
